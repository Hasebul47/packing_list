name: Deploy Packing List App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            mkdir -p "${{ secrets.PROJECT_PATH }}"
            git config --global --add safe.directory "${{ secrets.PROJECT_PATH }}" || true
            cd "${{ secrets.PROJECT_PATH }}"
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://x-access-token:${{ github.token }}@github.com/Hasebul47/packing_list.git
            fi
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/Hasebul47/packing_list.git || true
            git fetch origin main
            git reset --hard origin/main
            podman build -t packing-list-app .
            podman stop packing-list || true
            podman rm -f packing-list || true
            podman run -d --name packing-list --restart unless-stopped -p 8002:8002 packing-list-app
