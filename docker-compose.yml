services:
  packing-list:
    build: .
    image: packing-list-app:latest
    container_name: packing-list
    ports:
      - "8002:8002"           # ← host 8002 → container 8002
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8002
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
